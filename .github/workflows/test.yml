# ensure all apps and packages can still build and test
name: Run tests

env:
    HELIUS_KEY: "chewed-glass"

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    # Stable check required by the organization CI ruleset.
    ci-checks:
      name: ci-checks
      needs: [build]
      if: ${{ always() }}
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions: {}
      steps:
        - name: Verify required job results
          env:
            RESULTS: ${{ toJSON(needs) }}
          run: |
            echo "$RESULTS"
            echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'

    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
